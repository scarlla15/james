<!DOCTYPE html>
<html>
<head>
<title>james au</title>
<style>
body { background: black; color: white; text-align: center; padding-top: 80px; font-family: sans-serif; }
input { padding: 12px; border-radius: 10px; border: none; width: 200px; }
button { padding: 12px 25px; background: pink; border: none; border-radius: 10px; font-weight: bold; }
</style>
</head>
<body>
<h1>JAMES AU</h1>
<p>masukkan password untuk baca:</p>
<input type="password" id="pw" placeholder="password">
<br><br>
<button onclick="check()">MASUK</button>
<p id="salah" style="color:red"></p>

<script>
function check() {
  let pass = document.getElementById("pw").value;
  if (pass == "james") {
    window.location.href = "cerita.html";
  } else {
    document.getElementById("salah").innerHTML = "password salah! cuba lagi";
  }
}
</script>
</body>
</html>
